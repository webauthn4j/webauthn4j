version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 0 25 * *"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 0 25 * *"
    labels:
      - "dev-dependencies"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
