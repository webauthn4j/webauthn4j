name: Doc

on:
  push:
    branches:
      - master
env:
  JAVA_VERSION: 25

jobs:
  build:
    name: Build
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git
        run: |
          git submodule init
          git submodule update
          git config --local user.email "mail@ynojima.net"
          git config --local user.name "ynojima"
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          ./gradlew javadoc generateReferenceJA generateReferenceEN :integration-tests:fido-integration-bdd:check
      - name: Commit & Push pages
        run: |
          rm -rf docs
          mv build/docs/asciidoc/html5 docs
          cp -r integration-tests/fido-integration-bdd/build/reports/bdd docs/bdd-report
          git checkout --orphan gh-pages
          git rm -rf --cached .
          git add docs
          git commit -m "Update docs"
          git push origin gh-pages -f
